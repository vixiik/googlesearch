<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Advanced Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="advanced-page">
  <header class="advanced-header">
    <a class="mini-logo" href="index.html" aria-label="Google home"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span></a>
    <a class="top-link" href="index.html">Google Search</a>
  </header>
  <main class="advanced-main">
    <h1>Advanced Search</h1>
    <div class="advanced-rule"></div>
    <form action="https://www.google.com/search" method="get" class="advanced-form">
      <div class="advanced-intro"><span>Find pages with...</span><span class="how-heading">To do this in the search box</span></div>
      <label class="advanced-row"><span>all these words:</span><input type="text" name="as_q" aria-label="All these words"><small>Type the important words: <b>tri-colour rat terrier</b></small></label>
      <label class="advanced-row"><span>this exact word or phrase:</span><input type="text" name="as_epq" aria-label="This exact word or phrase"><small>Put exact words in quotes: <b>"rat terrier"</b></small></label>
      <label class="advanced-row"><span>any of these words:</span><input type="text" name="as_oq" aria-label="Any of these words"><small>Type OR between all the words you want: <b>miniature OR standard</b></small></label>
      <label class="advanced-row"><span>none of these words:</span><input type="text" name="as_eq" aria-label="None of these words"><small>Put a minus sign just before words you don't want: <b>-rodent, -"Jack Russell"</b></small></label>
      <div class="advanced-submit"><button type="submit">Advanced Search</button></div>
    </form>
  </main>
  <footer class="advanced-footer">Search smarter with advanced search options</footer>
</body>
</html>
